name: Container and deploy hosted MCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Environment to deploy after publishing the image
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
          - none

permissions:
  contents: read

concurrency:
  group: hosted-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.bugfender.com
  IMAGE_NAME: bugfender/bugfender-mcp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Build production image
        run: docker build --tag hosted-mcp:test .
      - name: Smoke-test production image
        run: |
          set -euo pipefail
          container_id="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m -p 127.0.0.1:3002:3002 hosted-mcp:test)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - id: image
        name: Resolve immutable image tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-deployment:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment != 'none')
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.deploy_environment }}
    steps:
      - name: Trigger OVH deployment
        env:
          GH_TOKEN: ${{ secrets.OVH_LAB_REPO_TOKEN }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.deploy_environment }}
        run: |
          set -euo pipefail
          event_type="hosted-mcp-${TARGET_ENV}"
          payload="$(jq -n --arg event_type "$event_type" --arg image_tag "$IMAGE_TAG" \
            '{event_type: $event_type, client_payload: {image_tag: $image_tag}}')"
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bugfender/ovh-lab/dispatches \
            --data "$payload"
